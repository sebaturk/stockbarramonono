<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monono — Bar Management</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#14120F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monono Stock">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14120F;
    --surface: #1D1A16;
    --surface-2: #262220;
    --border: #34302A;
    --text: #F1EAE0;
    --text-muted: #9C9284;
    --text-faint: #6E6659;
    --accent: #E8575A;
    --accent-dim: #8E2F31;
    --accent-text: #1A0808;
    --urgent: #E2564E;
    --urgent-bg: rgba(226, 86, 78, 0.14);
    --pronto: #EEAF3E;
    --pronto-bg: rgba(238, 175, 62, 0.14);
    --ok: #4EAE79;
    --ok-bg: rgba(78, 174, 121, 0.13);
    --camino: #5B9BE6;
    --camino-bg: rgba(91, 155, 230, 0.15);
    --radius: 14px;
    --radius-sm: 9px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  h1, h2, h3, .display {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  button { font-family: inherit; }
  ::selection { background: var(--accent-dim); color: #fff; }

  #app { max-width: 640px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    padding: calc(env(safe-area-inset-top,0px) + 16px) 18px 12px;
    background: linear-gradient(var(--bg) 80%, transparent);
  }
  .topbar-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .brand { font-size: 22px; color: var(--text); }
  .brand span { color: var(--accent); }
  .brand-sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; }

  .tabs {
    display: flex; gap: 4px; margin: 14px 0 0; padding: 4px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  }
  .tab {
    flex: 1; text-align: center; padding: 9px 4px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--text-muted);
    background: transparent; border: none; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tab.active { background: var(--accent); color: var(--accent-text); }

  main { flex: 1; padding: 4px 18px calc(env(safe-area-inset-bottom,0px) + 36px); }

  /* ---------- Cards / generic ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px;
  }
  .muted { color: var(--text-muted); }
  .faint { color: var(--text-faint); }

  /* ---------- Dashboard ---------- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer; transition: border-color .15s ease;
  }
  .stat-card:active { border-color: var(--accent); }
  .stat-num { font-family: "Fraunces", serif; font-size: 30px; font-weight: 600; line-height: 1; }
  .stat-label { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }
  .stat-card.urgent .stat-num { color: var(--urgent); }
  .stat-card.pronto .stat-num { color: var(--pronto); }
  .stat-card.ok .stat-num { color: var(--ok); }
  .stat-card.camino .stat-num { color: var(--camino); }

  .section-title {
    font-size: 13px; text-transform: none; color: var(--text-muted);
    margin: 26px 0 10px; font-weight: 600;
  }
  .empty-note {
    text-align: center; padding: 30px 16px; color: var(--text-faint); font-size: 14px;
  }

  /* ---------- Product rows ---------- */
  .cat-group { margin-bottom: 22px; }
  .cat-header {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; font-weight: 700; letter-spacing: .02em; color: var(--text-muted);
    padding: 0 2px 8px;
  }
  .cat-header .count { color: var(--text-faint); font-weight: 500; }

  .product-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 4px; border-bottom: 1px solid var(--border);
  }
  .product-row:last-child { border-bottom: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.urgent { background: var(--urgent); }
  .dot.pronto { background: var(--pronto); }
  .dot.ok { background: var(--ok); }
  .dot.camino { background: var(--camino); }

  .product-info { flex: 1; min-width: 0; }
  .product-name { font-size: 14.5px; font-weight: 600; color: var(--text); }
  .product-meta { font-size: 12px; color: var(--text-faint); margin-top: 2px; }

  .stepper { display: flex; align-items: center; gap: 0; flex-shrink: 0; }
  .step-btn {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 16px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .step-btn:active { background: var(--accent-dim); }
  .step-input {
    width: 52px; text-align: center; background: transparent; border: none; color: var(--text);
    font-size: 15px; font-weight: 700; font-family: "Inter", sans-serif;
  }
  .step-input:focus { outline: none; }
  .row-edit-btn {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: var(--text-faint); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  /* ---------- Search / filter ---------- */
  .search-wrap { position: sticky; top: 112px; z-index: 10; background: var(--bg); padding: 10px 0 4px; }
  .search-input {
    width: 100%; padding: 11px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 14px;
  }
  .search-input::placeholder { color: var(--text-faint); }
  .chips { display: flex; gap: 7px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-muted); font-size: 12.5px; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 18px; border-radius: var(--radius-sm); border: 1px solid transparent;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-secondary { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .btn-danger { background: transparent; color: var(--urgent); border-color: rgba(226,86,78,.35); }
  .btn-block { width: 100%; }
  .fab {
    position: fixed; bottom: calc(env(safe-area-inset-bottom,0px) + 22px); right: max(18px, calc((100vw - 640px)/2 + 18px));
    width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
    font-size: 26px; border: none; box-shadow: 0 8px 24px rgba(0,0,0,.4); cursor: pointer; z-index: 25;
  }

  /* ---------- Pedidos ---------- */
  .provider-group { margin-bottom: 18px; }
  .provider-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 0 2px;
  }
  .provider-name { font-size: 15px; font-weight: 700; }
  .copy-btn {
    font-size: 12px; font-weight: 700; color: var(--accent); background: transparent; border: 1px solid var(--accent-dim);
    padding: 6px 11px; border-radius: 999px; cursor: pointer;
  }
  .copy-btn.copied { color: var(--ok); border-color: var(--ok); }
  .pedido-row {
    display: flex; align-items: center; justify-content: space-between; padding: 10px 4px;
    border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .pedido-row:last-child { border-bottom: none; }
  .pedido-qty { font-weight: 700; color: var(--text); }
  .badge {
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
  }
  .badge.urgent { background: var(--urgent-bg); color: var(--urgent); }
  .badge.pronto { background: var(--pronto-bg); color: var(--pronto); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.camino { background: var(--camino-bg); color: var(--camino); }

  /* ---------- Estado En camino / Recibido ---------- */
  .chip-count { opacity: .65; font-weight: 500; margin-left: 3px; }
  .chip.active.s-camino { background: var(--camino); border-color: var(--camino); color: #07121F; }
  .chip.active.s-urgent { background: var(--urgent); border-color: var(--urgent); color: #fff; }
  .chip.active.s-pronto { background: var(--pronto); border-color: var(--pronto); color: #1F1503; }
  .chip.active.s-ok { background: var(--ok); border-color: var(--ok); color: #07170E; }
  .camino-line { display: flex; align-items: center; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
  .recv-btn {
    font-size: 12px; font-weight: 700; color: var(--camino); background: var(--camino-bg);
    border: 1px solid rgba(91,155,230,.45); padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .recv-btn:active { background: rgba(91,155,230,.3); }
  .undo-btn {
    font-size: 11.5px; font-weight: 600; color: var(--text-faint); background: transparent;
    border: none; padding: 5px 4px; cursor: pointer; text-decoration: underline;
  }
  .pedido-check { display: flex; align-items: center; margin-right: 10px; flex-shrink: 0; cursor: pointer; }
  .pedido-check input { width: 19px; height: 19px; accent-color: var(--accent); cursor: pointer; }
  .pedido-row.unchecked .pedido-info, .pedido-row.unchecked .pedido-side { opacity: .45; }
  .pedido-info { flex: 1; min-width: 0; }
  .mark-btn {
    width: 100%; margin-top: 8px; padding: 11px 14px; border-radius: var(--radius-sm);
    border: 1px solid rgba(91,155,230,.5); background: var(--camino-bg); color: var(--camino);
    font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .mark-btn:disabled { opacity: .4; cursor: default; }
  .section-title.camino { color: var(--camino); }

  /* ---------- Proveedores ---------- */
  .prov-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
  }
  .prov-top { display: flex; justify-content: space-between; align-items: baseline; }
  .prov-name { font-size: 15px; font-weight: 700; }
  .prov-line { font-size: 12.5px; color: var(--text-muted); margin-top: 5px; }
  .prov-empty { color: var(--text-faint); font-style: italic; }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,9,7,.6); backdrop-filter: blur(2px);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .sheet {
    width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--border);
    border-bottom: none; border-radius: 20px 20px 0 0; padding: 20px 20px calc(env(safe-area-inset-bottom,0px) + 22px);
    max-height: 88vh; overflow-y: auto; position: relative;
  }
  .overlay.full { align-items: stretch; }
  .sheet.full { max-width: 640px; height: 100%; max-height: 100%; border-radius: 0; border: none; }
  .sheet-title { font-size: 18px; margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    font-family: inherit;
    width: 100%; padding: 11px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 14.5px;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
  .close-x { position: absolute; top: 14px; right: 16px; background: none; border: none; color: var(--text-faint); font-size: 20px; cursor: pointer; }

  .toast {
    position: fixed; bottom: calc(env(safe-area-inset-bottom,0px) + 90px); left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-size: 13px;
    padding: 10px 16px; border-radius: 999px; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .toast.show { opacity: 1; }

  .sync-pill {
    font-size: 10.5px; color: var(--text-faint); display: flex; align-items: center; gap: 5px; margin-top: 8px;
  }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
  .sync-pill.local .sync-dot { background: var(--pronto); }
  .sync-pill.cloud .sync-dot { background: var(--ok); }

  /* ---------- Nota de pedido ---------- */
  .nl { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; }
  .nl-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .nl-x { background: none; border: none; color: var(--text-faint); font-size: 16px; cursor: pointer; padding: 2px 6px; }
  .nl-fields { display: grid; grid-template-columns: .8fr 1.2fr 1fr; gap: 8px; margin-top: 10px; }
  .nl-fields label { font-size: 11px; font-weight: 600; color: var(--text-muted); display: block; }
  .nl-fields input {
    width: 100%; margin-top: 4px; padding: 9px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 14.5px; font-family: inherit;
  }
  .nl-sub { text-align: right; font-size: 12.5px; color: var(--text-muted); margin-top: 8px; }

  .nota-paper { background: #fff; color: #111; border-radius: 10px; padding: 18px 16px; font-family: "Inter", Arial, sans-serif; font-size: 13px; line-height: 1.45; }
  .nota-head { display: flex; justify-content: space-between; gap: 12px; border-bottom: 2px solid #111; padding-bottom: 10px; margin-bottom: 12px; }
  .nota-title { font-weight: 800; font-size: 18px; }
  .nota-biz { font-size: 13px; color: #444; margin-top: 2px; }
  .nota-folio { text-align: right; font-weight: 800; font-size: 16px; }
  .nota-folio small { display: block; font-weight: 500; color: #555; font-size: 12px; }
  .nota-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-bottom: 12px; }
  .nota-meta span { display: block; font-size: 10.5px; color: #666; }
  .nota-meta b { font-size: 13px; }
  .nota-table { width: 100%; border-collapse: collapse; }
  .nota-table th { text-align: left; font-size: 11px; color: #555; border-bottom: 1px solid #999; padding: 5px 4px; font-weight: 600; }
  .nota-table td { padding: 7px 4px; border-bottom: 1px solid #ddd; vertical-align: top; }
  .nota-table .num { text-align: right; white-space: nowrap; }
  .nota-total { display: flex; justify-content: space-between; font-size: 16px; font-weight: 800; padding: 10px 4px 4px; border-top: 2px solid #111; }
  .nota-pay { margin-top: 10px; padding: 8px 10px; border: 2px solid #111; font-weight: 800; text-align: center; }
  .nota-pay.soft { border: 1px solid #999; font-weight: 600; }
  .nota-notes { margin-top: 10px; font-size: 12.5px; white-space: pre-wrap; }
  .nota-void { color: #B00020; border: 2px solid #B00020; font-weight: 800; text-align: center; padding: 6px; margin-bottom: 10px; }

  #print-root { display: none; }
  @media print {
    @page { margin: 14mm; }
    html, body { background: #fff !important; height: auto !important; }
    body > * { display: none !important; }
    body > #print-root { display: block !important; }
    #print-root .nota-paper { padding: 0; border-radius: 0; font-size: 12.5pt; }
  }

  /* ---------- Login ---------- */
  .login-screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg); z-index: 100;
  }
  .login-card {
    width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 26px 22px;
  }
  .login-card .brand { display: block; text-align: center; margin-bottom: 2px; }
  .login-card .brand-sub { text-align: center; margin-bottom: 20px; }
  .login-error {
    background: var(--urgent-bg); color: var(--urgent); font-size: 12.5px; padding: 9px 12px;
    border-radius: var(--radius-sm); margin-bottom: 12px;
  }
  .login-loading { text-align: center; color: var(--text-faint); font-size: 13px; }
  code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }

  /* ---------- Logout ---------- */
  .logout-btn {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-muted); font-size: 15px; cursor: pointer; flex-shrink: 0;
  }

  /* ---------- Day checkboxes ---------- */
  .day-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .day-chip {
    display: flex; align-items: center; gap: 5px; padding: 7px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2); font-size: 12.5px; color: var(--text-muted);
    cursor: pointer; user-select: none;
  }
  .day-chip input { width: 13px; height: 13px; accent-color: var(--accent); }
  .day-chip:has(input:checked) { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }

  /* ---------- Reminders ---------- */
  .reminder-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border);
    font-size: 13.5px; line-height: 1.4;
  }
  .reminder-row:last-child { border-bottom: none; }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #14120F; --surface: #1D1A16; --surface-2: #262220; --border: #34302A;
      --text: #F1EAE0; --text-muted: #9C9284; --text-faint: #6E6659;
    }
  }
</style>
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card" id="login-card">
    <h1 class="brand">Monono <span>Stock</span></h1>
    <div class="brand-sub">Iniciá sesión para continuar</div>
    <div id="login-loading" class="login-loading">Conectando…</div>
  </div>
</div>

<div id="app" style="display:none;"></div>
<div class="toast" id="toast"></div>

<!-- Firebase (ver README.md para la configuración) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
(function(){

  /* ---- Recordatorios (proveedores que toman pedidos hoy y tienen faltantes) ---- */
  function remindersToday(){
    var today = todayName();
    var list = [];
    Store.providers.forEach(function(v){
      var orderDays = v.orderDays || [];
      if(orderDays.indexOf(today) === -1) return;
      var items = Store.products.filter(function(p){
        var s = statusOf(p);
        return p.provider === v.name && (s==="urgent" || s==="pronto");
      });
      if(items.length > 0){
        list.push({
          provider: v.name,
          count: items.length,
          urgentCount: items.filter(function(p){ return statusOf(p)==="urgent"; }).length
        });
      }
    });
    return list;
  }
  function anyOrderDaysConfigured(){
    return Store.providers.some(function(v){ return v.orderDays && v.orderDays.length; });
  }

  /* ---- Dashboard ---- */
  function dashboardHtml(){
    var c = counts();
    var urgentList = Store.products.filter(function(p){ return statusOf(p)==="urgent"; })
      .sort(function(a,b){ return (Number(a.current)/Math.max(Number(a.min)||1,1)) - (Number(b.current)/Math.max(Number(b.min)||1,1)); });

    var html = '';

    html += '<div class="stat-grid">';
    html += '<div class="stat-card urgent" data-goto="stock" data-status="urgent"><div class="stat-num" id="cnt-urgent">'+c.urgent+'</div><div class="stat-label">Urgente</div></div>';
    html += '<div class="stat-card pronto" data-goto="stock" data-status="pronto"><div class="stat-num" id="cnt-pronto">'+c.pronto+'</div><div class="stat-label">Por pedir pronto</div></div>';
    html += '<div class="stat-card camino" data-goto="stock" data-status="camino"><div class="stat-num" id="cnt-camino">'+c.camino+'</div><div class="stat-label">En camino</div></div>';
    html += '<div class="stat-card ok" data-goto="stock" data-status="ok"><div class="stat-num" id="cnt-ok">'+c.ok+'</div><div class="stat-label">OK</div></div>';
    html += '<div class="stat-card" style="grid-column:1 / -1;" data-goto="stock" data-status="ALL"><div class="stat-num" id="cnt-total">'+c.total+'</div><div class="stat-label">Productos totales</div></div>';
    html += '</div>';

    if(anyOrderDaysConfigured()){
      var reminders = remindersToday();
      html += '<div class="section-title">Recordatorios de hoy · ' + esc(todayName()) + '</div>';
      if(reminders.length === 0){
        html += '<div class="card empty-note" style="padding:16px;">Ningún proveedor que toma pedidos hoy tiene productos pendientes.</div>';
      } else {
        html += '<div class="card" style="padding:0;">';
        reminders.forEach(function(r,i){
          html += '<div class="reminder-row"' + (i<reminders.length-1?'':' style="border-bottom:none;"') + '>';
          html += '<span>🔔</span><div><b>' + esc(r.provider) + '</b> toma pedidos hoy — ' + r.count + ' producto' + (r.count>1?'s':'') + ' para reponer' +
            (r.urgentCount>0 ? ' <span class="badge urgent" style="margin-left:2px;">' + r.urgentCount + ' urgente' + (r.urgentCount>1?'s':'') + '</span>' : '') + '</div>';
          html += '</div>';
        });
        html += '</div>';
      }
    }

    html += '<div class="section-title">Necesitan atención ahora</div>';
    if(urgentList.length === 0){
      html += '<div class="card empty-note">Todo en orden. No hay productos por debajo del mínimo 🎉</div>';
    } else {
      html += '<div class="card">';
      urgentList.slice(0,8).forEach(function(p,i){
        html += productRow(p, { compact:true, border: i < Math.min(urgentList.length,8)-1 });
      });
      html += '</div>';
      if(urgentList.length > 8){
        html += '<div class="faint" style="text-align:center;font-size:12.5px;margin-top:10px;">+' + (urgentList.length-8) + ' productos urgentes más — ver en Stock</div>';
      }
    }
    return html;
  }

  /* ---- Stock ---- */
  function visibleProducts(){
    var q = State.search.trim().toLowerCase();
    return Store.products.filter(function(p){
      if(State.categoryFilter !== "ALL" && p.category !== State.categoryFilter) return false;
      if(State.dashboardStatusFilter && State.dashboardStatusFilter !== "ALL" && statusOf(p) !== State.dashboardStatusFilter) return false;
      if(q && p.name.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function stockHtml(){
    var cats = ["ALL"].concat(CATEGORY_ORDER.filter(function(c){
      return Store.products.some(function(p){ return p.category === c; });
    }));
    // include any custom categories not in the base list
    Store.products.forEach(function(p){ if(cats.indexOf(p.category) === -1) cats.push(p.category); });

    var html = '';
    html += '<div class="search-wrap">';
    html += '<input class="search-input" id="search-input" placeholder="Buscar producto…" value="' + esc(State.search) + '">';
    var sc = counts();
    var activeS = State.dashboardStatusFilter || "ALL";
    var sOpts = [["ALL","Todos",sc.total],["urgent","Urgente",sc.urgent],["pronto","Por pedir",sc.pronto],["camino","En camino",sc.camino],["ok","OK",sc.ok]];
    html += '<div class="chips">';
    sOpts.forEach(function(o){
      html += '<button class="chip s-' + o[0] + ' ' + (activeS===o[0]?'active':'') + '" data-sfilter="' + o[0] + '">' + o[1] + '<span class="chip-count">' + o[2] + '</span></button>';
    });
    html += '</div>';
    html += '<div class="chips" style="padding-top:6px;">';
    cats.forEach(function(c){
      var label = c === "ALL" ? "Todas" : c.charAt(0) + c.slice(1).toLowerCase();
      html += '<button class="chip ' + (State.categoryFilter===c?"active":"") + '" data-cat="' + esc(c) + '">' + esc(label) + '</button>';
    });
    html += '</div></div>';

    var list = visibleProducts();
    if(list.length === 0){
      html += '<div class="empty-note">No se encontraron productos.<br>Probá con otra búsqueda o agregá uno nuevo.</div>';
    } else {
      var byCat = {};
      var order = [];
      list.forEach(function(p){
        if(!byCat[p.category]){ byCat[p.category] = []; order.push(p.category); }
        byCat[p.category].push(p);
      });
      order.sort(function(a,b){
        var ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
        if(ia===-1) ia = 999; if(ib===-1) ib = 999;
        return ia - ib;
      });
      order.forEach(function(cat){
        var items = byCat[cat];
        html += '<div class="cat-group">';
        html += '<div class="cat-header"><span>' + esc(cat) + '</span><span class="count">' + items.length + '</span></div>';
        html += '<div class="card">';
        items.forEach(function(p,i){
          html += productRow(p, { border: i < items.length - 1, editable: true });
        });
        html += '</div></div>';
      });
    }
    return html;
  }

  function productRow(p, opts){
    opts = opts || {};
    var s = statusOf(p);
    var borderStyle = opts.border === false ? ' style="border-bottom:none;"' : '';
    var row = '<div class="product-row"' + borderStyle + '>';
    row += '<span class="dot ' + s + '"></span>';
    row += '<div class="product-info">';
    row += '<div class="product-name">' + esc(p.name) + '</div>';
    row += '<div class="product-meta">' + esc(p.provider||'—') + ' · min ' + fmtNum(p.min) + ' / max ' + fmtNum(p.max) + ' ' + esc(p.unit) + ' · ' + timeAgo(p.updatedAt) + (p.updatedBy ? ' · ' + esc(shortUser(p.updatedBy)) : '') + '</div>';
    if(p.ordered){
      row += '<div class="camino-line"><span class="badge camino">En camino' + (p.orderedLabel ? ' · ' + esc(p.orderedLabel) : (p.orderedQty ? ' · +' + fmtNum(p.orderedQty) : '')) + '</span>' +
        '<button class="recv-btn" data-receive="' + p.id + '">📦 Recibido</button></div>';
    }
    row += '</div>';
    row += '<div class="stepper">';
    row += '<button class="step-btn" data-step="-1" data-id="' + p.id + '">−</button>';
    row += '<input class="step-input" type="number" inputmode="decimal" data-current="' + p.id + '" value="' + fmtNum(p.current) + '">';
    row += '<button class="step-btn" data-step="1" data-id="' + p.id + '">+</button>';
    row += '</div>';
    if(opts.editable){
      row += '<button class="row-edit-btn" data-edit-product="' + p.id + '">✎</button>';
    }
    row += '</div>';
    return row;
  }

  /* ---- Pedidos sugeridos ---- */
  function pedidosHtml(){
    var head = pedidosHeadHtml();
    if(State.pedidosView === "notas") return head + notasHtml();
    var need = Store.products.filter(function(p){ var s = statusOf(p); return s==="urgent" || s==="pronto"; });
    var ordered = Store.products.filter(function(p){ return p.ordered; });
    if(need.length === 0 && ordered.length === 0){
      return head + '<div class="empty-note">Todo en orden. No hay pedidos sugeridos por ahora 🎉</div>';
    }
    var html = head;
    var today = todayName();

    if(need.length === 0){
      html += '<div class="card empty-note" style="padding:16px;margin-top:6px;">No hay productos pendientes de pedir 🎉</div>';
    } else {
      var byProv = {};
      var order = [];
      need.forEach(function(p){
        var prov = p.provider || "Sin proveedor";
        if(!byProv[prov]){ byProv[prov] = []; order.push(prov); }
        byProv[prov].push(p);
      });
      order.sort(function(a,b){ return a.localeCompare(b); });

      order.forEach(function(prov){
        var items = byProv[prov].sort(function(a,b){ return statusOf(a)==="urgent" ? -1 : 1; });
        var provData = Store.providers.find(function(v){ return v.name === prov; });
        var takesToday = provData && provData.orderDays && provData.orderDays.indexOf(today) !== -1;
        var selected = items.filter(function(p){ return !State.orderUnchecked[p.id]; }).length;
        html += '<div class="provider-group">';
        html += '<div class="provider-head"><span class="provider-name">' + esc(prov) + (takesToday ? ' <span class="badge ok">🔔 hoy</span>' : '') + '</span>';
        html += '<button class="copy-btn" data-nota-provider="' + esc(prov) + '">📝 Nota de pedido</button></div>';
        html += '<div class="card">';
        items.forEach(function(p,i){
          var qty = Math.max(Number(p.max) - Number(p.current), 0);
          var s = statusOf(p);
          var checked = !State.orderUnchecked[p.id];
          html += '<div class="pedido-row' + (checked ? '' : ' unchecked') + '" style="' + (i<items.length-1?'':'border-bottom:none;') + '">';
          html += '<label class="pedido-check"><input type="checkbox" data-sel="' + p.id + '"' + (checked ? ' checked' : '') + ' aria-label="Incluir ' + esc(p.name) + ' en el pedido"></label>';
          html += '<div class="pedido-info"><div style="font-weight:600;">' + esc(p.name) + '</div><div class="faint" style="font-size:12px;">actual ' + fmtNum(p.current) + ' ' + esc(p.unit) + ' · mín ' + fmtNum(p.min) + '</div></div>';
          html += '<div class="pedido-side" style="text-align:right;display:flex;align-items:center;gap:8px;">';
          html += '<span class="badge ' + s + '">' + STATUS_LABEL[s] + '</span>';
          html += '<span class="pedido-qty">+' + fmtNum(qty) + '</span>';
          html += '</div></div>';
        });
        html += '</div>';
        html += '<button class="mark-btn" data-mark-provider="' + esc(prov) + '"' + (selected===0 ? ' disabled' : '') + '>' +
          (selected===0 ? 'Marcar como pedido' : 'Marcar como pedido (' + selected + ')') + '</button>';
        html += '</div>';
      });
    }

    if(ordered.length > 0){
      var oByProv = {};
      var oOrder = [];
      ordered.forEach(function(p){
        var prov = p.provider || "Sin proveedor";
        if(!oByProv[prov]){ oByProv[prov] = []; oOrder.push(prov); }
        oByProv[prov].push(p);
      });
      oOrder.sort(function(a,b){ return a.localeCompare(b); });
      html += '<div class="section-title camino">En camino · ' + ordered.length + '</div>';
      oOrder.forEach(function(prov){
        var items = oByProv[prov].sort(function(a,b){ return String(a.orderedAt||"").localeCompare(String(b.orderedAt||"")); });
        html += '<div class="provider-group">';
        html += '<div class="provider-head"><span class="provider-name">' + esc(prov) + '</span></div>';
        html += '<div class="card">';
        items.forEach(function(p,i){
          html += '<div class="pedido-row" style="' + (i<items.length-1?'':'border-bottom:none;') + '">';
          html += '<div class="pedido-info"><div style="font-weight:600;">' + esc(p.name) + '</div>' +
            '<div class="faint" style="font-size:12px;">' + (p.orderedLabel ? 'pedido ' + esc(p.orderedLabel) + ' · ' : (p.orderedQty ? 'pedido +' + fmtNum(p.orderedQty) + ' ' + esc(p.unit) + ' · ' : '')) +
            (p.orderedFolio ? esc(p.orderedFolio) + ' · ' : '') + timeAgo(p.orderedAt) + (p.orderedBy ? ' · ' + esc(shortUser(p.orderedBy)) : '') + '</div></div>';
          html += '<div class="pedido-side" style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">';
          html += '<button class="recv-btn" data-receive="' + p.id + '">📦 Recibido</button>';
          html += '<button class="undo-btn" data-unorder="' + p.id + '">deshacer</button>';
          html += '</div></div>';
        });
        html += '</div></div>';
      });
    }
    return html;
  }

  /* ============ MODALS ============ */
  function dayCheckboxes(fieldName, selected){
    selected = selected || [];
    return WEEK_DAYS.map(function(d){
      var checked = selected.indexOf(d) !== -1 ? " checked" : "";
      return '<label class="day-chip"><input type="checkbox" name="' + fieldName + '" value="' + d + '"' + checked + '><span>' + shortDay(d) + '</span></label>';
    }).join('');
  }
  function openModal(innerHtml, opts){
    opts = opts || {};
    var ov = document.createElement("div");
    ov.className = "overlay" + (opts.full ? " full" : "");
    ov.id = "modal-overlay";
    ov.innerHTML = '<div class="sheet' + (opts.full ? ' full' : '') + '">' + innerHtml + '</div>';
    ov.addEventListener("click", function(e){ if(e.target === ov) closeModal(); });
    document.body.appendChild(ov);
  }
  function closeModal(){
    var ov = document.getElementById("modal-overlay");
    if(ov) ov.remove();
  }

  function editProductModal(p){
    var isNew = !p;
    p = p || { name:"", category:"", provider:"", unit:"pieza", min:0, max:0, current:0 };
    var catOptions = CATEGORY_ORDER.concat(Store.products.map(function(x){return x.category;}))
      .filter(function(v,i,a){ return v && a.indexOf(v)===i; });
    var html = '<button class="close-x" data-close>✕</button>';
    html += '<div class="sheet-title">' + (isNew ? "Nuevo producto" : "Editar producto") + '</div>';
    html += '<div class="field"><label>Nombre</label><input id="f-name" value="' + esc(p.name) + '"></div>';
    html += '<div class="field"><label>Categoría</label><input id="f-category" list="cat-list" value="' + esc(p.category) + '"><datalist id="cat-list">' + catOptions.map(function(c){return '<option value="'+esc(c)+'">';}).join('') + '</datalist></div>';
    html += '<div class="field-row"><div class="field"><label>Proveedor</label><input id="f-provider" list="prov-list" value="' + esc(p.provider) + '"><datalist id="prov-list">' + Store.providers.map(function(v){return '<option value="'+esc(v.name)+'">';}).join('') + '</datalist></div>';
    html += '<div class="field"><label>Unidad</label><input id="f-unit" value="' + esc(p.unit) + '" placeholder="pieza, ML, GR…"></div></div>';
    html += '<div class="field-row"><div class="field"><label>Stock mínimo</label><input id="f-min" type="number" value="' + fmtNum(p.min) + '"></div>';
    html += '<div class="field"><label>Stock máximo</label><input id="f-max" type="number" value="' + fmtNum(p.max) + '"></div></div>';
    html += '<div class="field"><label>Stock actual</label><input id="f-current" type="number" value="' + fmtNum(p.current) + '"></div>';
    html += '<div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin:16px 0 8px;">Cómo se compra (para la nota de pedido)</div>';
    html += '<div class="field-row"><div class="field"><label>Se compra por</label><input id="f-buytype" list="type-list" autocomplete="off" placeholder="botella, caja…" value="' + esc(p.buyType || "") + '"></div>' +
      '<div class="field"><label>Contenido (en ' + esc(p.unit || "unidad base") + ')</label><input id="f-packsize" type="number" step="any" min="0" placeholder="Ej: 750" value="' + (p.packSize ? esc(p.packSize) : "") + '"></div></div>';
    html += '<div class="field"><label>Último precio por presentación ($)</label><input id="f-lastprice" type="number" step="any" min="0" value="' + (p.lastPrice != null && p.lastPrice !== "" ? esc(p.lastPrice) : "") + '"></div>' + typeDatalist();
    html += '<div class="sheet-actions">';
    html += '<button class="btn btn-primary btn-block" id="save-product">Guardar</button>';
    html += '</div>';
    if(!isNew){
      html += '<button class="btn btn-danger btn-block" id="delete-product" style="margin-top:8px;">Eliminar producto</button>';
    }
    openModal(html);

    document.getElementById("save-product").onclick = function(){
      var name = document.getElementById("f-name").value.trim();
      if(!name){ showToast("El nombre es obligatorio"); return; }
      var buyType = document.getElementById("f-buytype").value.trim();
      var packSize = Number(document.getElementById("f-packsize").value) || 0;
      var lastPriceRaw = document.getElementById("f-lastprice").value;
      if(packSize > 0 && !buyType){ showToast("Indicá cómo se compra (botella, caja…) para usar el contenido"); return; }
      var data = {
        name: name,
        buyType: buyType || null,
        packSize: packSize > 0 ? packSize : null,
        lastPrice: lastPriceRaw === "" ? null : Number(lastPriceRaw),
        category: document.getElementById("f-category").value.trim() || "SIN CATEGORÍA",
        provider: document.getElementById("f-provider").value.trim(),
        unit: document.getElementById("f-unit").value.trim(),
        min: Number(document.getElementById("f-min").value) || 0,
        max: Number(document.getElementById("f-max").value) || 0,
        current: Number(document.getElementById("f-current").value) || 0,
        updatedAt: new Date().toISOString(),
        updatedBy: CurrentUser || null
      };
      if(isNew){ Store.addProduct(data).then(function(){ fullRenderWithFab(); showToast("Producto agregado"); }); }
      else { Store.updateProduct(p.id, data).then(function(){ fullRenderWithFab(); showToast("Producto actualizado"); }); }
      closeModal();
    };
    if(!isNew){
      document.getElementById("delete-product").onclick = function(){
        if(confirm("¿Eliminar \"" + p.name + "\" del stock?")){
          Store.deleteProduct(p.id).then(function(){ fullRenderWithFab(); showToast("Producto eliminado"); });
          closeModal();
        }
      };
    }
  }

  /* ============ NOTA DE PEDIDO ============ */
  function lineSub(l){
    var q = Number(l.qty), pr = l.price;
    if(l.qty === "" || isNaN(q) || pr === null || pr === undefined || pr === "" || isNaN(Number(pr))) return null;
    return round2(q * Number(pr));
  }

  // Valores iniciales de un renglón, tomados de la base (todo se puede cambiar en la pantalla)
  function defaultLine(p){
    var falta = Math.max((Number(p.max)||0) - (Number(p.current)||0), 0);
    var size = Number(p.packSize) || 0;
    var bt = (p.buyType || "").trim();
    var type, qty;
    if(!bt || normUnit(bt) === normUnit(p.unit)){ type = p.unit || "pieza"; qty = round2(falta); }
    else if(size > 0){ type = bt; qty = Math.ceil(falta / size); }
    else { type = bt; qty = ""; } // se compra en otra presentación y no sabemos el contenido: que lo cargue la persona
    var price = (bt && normUnit(bt) === normUnit(type) && p.lastPrice != null && p.lastPrice !== "") ? Number(p.lastPrice) : null;
    return {
      id: p.id, name: p.name, unit: p.unit, type: type, qty: qty, price: price,
      hint: "Faltan " + fmtQty(falta) + " " + (p.unit || "") + " · actual " + fmtQty(p.current) + " · máx " + fmtQty(p.max)
    };
  }

  function notaPaperHtml(o){
    var hasPrice = o.items.some(function(it){ return it.price != null; });
    var h = '<div class="nota-paper">';
    if(o.status === "anulada") h += '<div class="nota-void">NOTA ANULADA</div>';
    h += '<div class="nota-head"><div><div class="nota-title">Nota de pedido</div><div class="nota-biz">' + esc(BUSINESS_NAME) + '</div></div>' +
      '<div class="nota-folio">' + esc(o.folio) + '<small>' + fmtDMY(orderDateObj(o)) + '</small></div></div>';
    h += '<div class="nota-meta">' +
      '<div><span>Proveedor</span><b>' + esc(o.provider) + '</b></div>' +
      '<div><span>Fecha</span><b>' + esc(fmtDayDate(ymd(orderDateObj(o)))) + '</b></div>' +
      '<div><span>Forma de pago</span><b>' + esc(payLabel(o.paymentTerms)) + '</b></div>' +
      '<div><span>Solicita</span><b>' + esc(orderRequester(o)) + '</b></div></div>';
    h += '<table class="nota-table"><thead><tr><th>Producto</th><th class="num">Cantidad</th>' +
      (hasPrice ? '<th class="num">P. unit.</th><th class="num">Importe</th>' : '') + '</tr></thead><tbody>';
    o.items.forEach(function(it){
      h += '<tr><td>' + esc(it.name) + '</td><td class="num"><b>' + fmtQty(it.qty) + '</b> ' + esc(it.type) + '</td>' +
        (hasPrice ? '<td class="num">' + (it.price != null ? money(it.price) : '—') + '</td><td class="num">' + (it.subtotal != null ? money(it.subtotal) : '—') + '</td>' : '') + '</tr>';
    });
    h += '</tbody></table>';
    if(hasPrice){
      h += '<div class="nota-total"><span>Total' + (o.missingPrices ? ' (parcial)' : '') + '</span><span>' + money(o.total) + '</span></div>';
      if(o.missingPrices) h += '<div style="font-size:11.5px;color:#666;">Hay ' + o.missingPrices + ' producto(s) sin precio cargado.</div>';
    }
    if(o.paymentTerms === "anticipado") h += '<div class="nota-pay">PAGO ANTICIPADO' + (hasPrice ? ' — A pagar: ' + money(o.total) : '') + '</div>';
    else h += '<div class="nota-pay soft">' + esc(payLabel(o.paymentTerms)) + '</div>';
    if(o.notes) h += '<div class="nota-notes"><b>Observaciones:</b> ' + esc(o.notes) + '</div>';
    return h + '</div>';
  }

  function orderText(o){
    var L = [];
    L.push("NOTA DE PEDIDO " + o.folio);
    L.push(BUSINESS_NAME + " · " + fmtDMY(orderDateObj(o)));
    L.push("Proveedor: " + o.provider);
    if(o.deliveryDate) L.push("Entrega: " + fmtDayDate(o.deliveryDate));
    L.push("Pago: " + payLabel(o.paymentTerms));
    L.push("");
    o.items.forEach(function(it, i){
      var line = (i+1) + ". " + it.name + " — " + fmtQty(it.qty) + " " + it.type;
      if(it.price != null) line += " × " + money(it.price) + " = " + money(it.subtotal);
      L.push(line);
    });
    L.push("");
    if(o.items.some(function(it){ return it.price != null; })){
      L.push("TOTAL: " + money(o.total) + (o.missingPrices ? " (parcial, faltan precios)" : ""));
    }
    if(o.paymentTerms === "anticipado") L.push("** PAGO ANTICIPADO **");
    if(o.notes) L.push("Obs: " + o.notes);
    L.push("Solicita: " + orderRequester(o));
    return L.join("\n");
  }

  function waLink(phone, text){
    var digits = (phone || "").replace(/\D/g, "");
    if(digits.length === 10) digits = DEFAULT_COUNTRY_CODE + digits;
    return "https://wa.me/" + (digits.length >= 11 ? digits : "") + "?text=" + encodeURIComponent(text);
  }

  function copyText(text, msg){
    var done = function(){ showToast(msg || "Copiado"); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }

    root.innerHTML = notaPaperHtml(o);

  function notaEditModal(prov){
    var items = Store.products.filter(function(p){
      var s = statusOf(p);
      return (p.provider || "Sin proveedor") === prov && (s === "urgent" || s === "pronto") && !State.orderUnchecked[p.id];
    });
    if(items.length === 0){ showToast("Tildá al menos un producto para armar la nota"); return; }
    var provData = Store.providers.find(function(v){ return v.name === prov; }) || null;
    var lines = items.map(defaultLine);

    var html = '<button class="close-x" data-close>✕</button>';
    html += '<div class="sheet-title">Nota de pedido</div>';
    html += '<div class="faint" style="font-size:12.5px;margin:-6px 0 14px;">' + esc(prov) + ' · los datos vienen del stock; podés cambiar cantidad, tipo y precio.</div>';
    html += '<div class="field-row"><div class="field"><label>Forma de pago</label><select id="n-terms">' + payOptionsHtml((provData && provData.paymentTerms) || "contraentrega") + '</select></div>' +
      '<div class="field"><label>Fecha de la nota</label><input type="date" id="n-date" value="' + ymd(new Date()) + '"></div></div>';
    html += '<div class="field"><label>Solicita</label><input type="text" id="n-req" maxlength="40" value="' + esc(shortUser(CurrentUser)) + '" placeholder="Nombre de quien pide"></div>';
    html += '<div id="n-lines">' + lines.map(notaLineHtml).join('') + '</div>' + typeDatalist();
    html += '<div class="field"><label>Observaciones (opcional)</label><textarea id="n-notes" rows="2" placeholder="Ej: entregar por la puerta de atrás"></textarea></div>';
    html += '<label class="day-chip" style="margin-bottom:12px;"><input type="checkbox" id="n-mark" checked><span>Marcar estos productos como “En camino”</span></label>';
    html += '<div id="n-total" style="font-size:15px;margin:6px 0 4px;"></div>';
    html += '<div class="sheet-actions"><button class="btn btn-primary btn-block" id="n-generate">Generar nota</button></div>';
    openModal(html, { full: true });

    var wrap = document.getElementById("n-lines");
    var totalEl = document.getElementById("n-total");
    var genBtn = document.getElementById("n-generate");
    function findLine(id){ return lines.find(function(l){ return l.id === id; }); }
    function recalc(){
      var tot = 0, withPrice = 0;
      lines.forEach(function(l){
        var s = lineSub(l);
        var el = wrap.querySelector('[data-nl-sub="' + l.id + '"]');
        if(el) el.textContent = s == null ? "—" : money(s);
        if(s != null){ tot += s; withPrice++; }
      });
      if(lines.length === 0) totalEl.textContent = "";
      else if(withPrice === 0) totalEl.innerHTML = '<span class="faint">Cargá los precios para ver el total.</span>';
      else totalEl.innerHTML = 'Total: <b>' + money(tot) + '</b>' + (withPrice < lines.length ? ' <span class="faint">(' + (lines.length - withPrice) + ' sin precio)</span>' : '');
      genBtn.disabled = lines.length === 0;
    }
    wrap.addEventListener("input", function(e){
      var t = e.target;
      if(!t.dataset || !t.dataset.nl) return;
      var l = findLine(t.closest(".nl").dataset.line);
      if(!l) return;
      if(t.dataset.nl === "qty") l.qty = t.value === "" ? "" : Number(t.value);
      else if(t.dataset.nl === "type") l.type = t.value;
      else l.price = t.value === "" ? null : Number(t.value);
      recalc();
    });
    wrap.addEventListener("click", function(e){
      var b = e.target.closest && e.target.closest("[data-nl-remove]");
      if(!b) return;
      var id = b.dataset.nlRemove;
      lines = lines.filter(function(l){ return l.id !== id; });
      var node = b.closest(".nl"); if(node) node.remove();
      recalc();
    });
    recalc();

    genBtn.onclick = async function(){
      for(var i = 0; i < lines.length; i++){
        var q = Number(lines[i].qty);
        if(lines[i].qty === "" || isNaN(q) || q <= 0){ showToast("Revisá la cantidad de " + lines[i].name); return; }
        if(!String(lines[i].type || "").trim()){ showToast("Indicá el tipo (botella, caja…) de " + lines[i].name); return; }
      }
      genBtn.disabled = true; genBtn.textContent = "Generando…";
      try {
        var folio = await Store.nextFolio();
        var iso = new Date().toISOString();
        var itemsOut = lines.map(function(l){
          var price = (l.price === null || l.price === "" || isNaN(Number(l.price))) ? null : Number(l.price);
          var qty = round2(l.qty);
          return { productId: l.id, name: l.name, qty: qty, type: String(l.type).trim(), price: price, subtotal: price == null ? null : round2(qty * price) };
        });
        var total = 0, missing = 0;
        itemsOut.forEach(function(it){ if(it.subtotal == null) missing++; else total += it.subtotal; });
        var order = {
          folio: folio, createdAt: iso, createdBy: CurrentUser || null,
          noteDate: document.getElementById("n-date").value || ymd(new Date()),
          requestedBy: document.getElementById("n-req").value.trim() || shortUser(CurrentUser),
          provider: prov, providerPhone: (provData && provData.phone) || "",
          paymentTerms: document.getElementById("n-terms").value,
          deliveryDate: "",
          notes: document.getElementById("n-notes").value.trim(),
          items: itemsOut, total: round2(total), missingPrices: missing,
          status: "activa", paid: false, paidAt: null, paidBy: null
        };
        var mark = document.getElementById("n-mark").checked;
        var id = await Store.createOrder(order);

        itemsOut.forEach(function(it){
          var p = Store.products.find(function(x){ return x.id === it.productId; });
          if(!p) return;
          var upd = {};
          if(it.price != null){ upd.lastPrice = it.price; upd.buyType = it.type; }
          if(mark){
            var bt = upd.buyType || p.buyType;
            var base = null;
            if(normUnit(it.type) === normUnit(p.unit)) base = it.qty;
            else if(Number(p.packSize) > 0 && bt && normUnit(it.type) === normUnit(bt)) base = round2(it.qty * Number(p.packSize));
            upd.ordered = true; upd.orderedQty = base; upd.orderedLabel = fmtQty(it.qty) + " " + it.type;
            upd.orderedFolio = folio; upd.orderedAt = iso; upd.orderedBy = CurrentUser || null;
            delete State.orderUnchecked[p.id];
          }
          if(Object.keys(upd).length) Store.updateProduct(p.id, upd);
        });
        closeModal();
        fullRenderWithFab();
        orderViewModal(id);
        showToast("Nota " + folio + " generada");
      } catch(e){
        console.error(e);
        showToast("No se pudo guardar la nota. Revisá tu conexión y probá de nuevo.");
        genBtn.disabled = false; genBtn.textContent = "Generar nota";
      }
    };
  }

    var st = o.status === "anulada" ? ["urgent","Anulada"] : (o.paid ? ["ok","Pagada"] : ["pronto","Por pagar"]);

    html += notaPaperHtml(o);
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;">' +
      '<button class="btn btn-secondary" id="o-copy">Copiar texto</button>' +
      '<button class="btn btn-secondary" id="o-wa">Enviar por WhatsApp</button>' +
      '<button class="btn btn-secondary" id="o-print" style="grid-column:1 / -1;">Imprimir / guardar PDF</button></div>';
    if(o.status !== "anulada"){
      html += '<button class="btn ' + (o.paid ? 'btn-secondary' : 'btn-primary') + ' btn-block" id="o-pay" style="margin-top:12px;">' + (o.paid ? 'Marcar como no pagada' : 'Marcar como pagada') + '</button>';
      html += '<button class="btn btn-danger btn-block" id="o-void" style="margin-top:8px;">Anular nota</button>';
    }
    if(o.paid && o.paidAt) html += '<div class="faint" style="font-size:12px;margin-top:10px;text-align:center;">Pagada ' + timeAgo(o.paidAt) + (o.paidBy ? ' · ' + esc(shortUser(o.paidBy)) : '') + '</div>';
    openModal(html, { full: true });

    document.getElementById("o-copy").onclick = function(){ copyText(orderText(o), "Nota copiada"); };
    document.getElementById("o-wa").onclick = function(){ window.open(waLink(o.providerPhone, orderText(o)), "_blank"); };
    document.getElementById("o-print").onclick = function(){ printOrder(o); };
    var payBtn = document.getElementById("o-pay");
    if(payBtn) payBtn.onclick = async function(){
      var nowPaid = !o.paid;
      await Store.updateOrder(id, nowPaid ? { paid: true, paidAt: new Date().toISOString(), paidBy: CurrentUser || null } : { paid: false, paidAt: null, paidBy: null });
      closeModal(); fullRenderWithFab();
      showToast(nowPaid ? "Nota marcada como pagada" : "Nota marcada como no pagada");
    };
    var voidBtn = document.getElementById("o-void");
    if(voidBtn) voidBtn.onclick = async function(){
      if(!confirm("¿Anular la nota " + o.folio + "? Los productos que seguían “En camino” por esta nota vuelven a pendientes.")) return;
      await Store.updateOrder(id, { status: "anulada", voidedAt: new Date().toISOString(), voidedBy: CurrentUser || null });
      Store.products.filter(function(p){ return p.ordered && p.orderedFolio === o.folio; }).forEach(function(p){
        Store.updateProduct(p.id, { ordered: false, orderedQty: null, orderedAt: null, orderedBy: null, orderedLabel: null, orderedFolio: null });
      });
      closeModal(); fullRenderWithFab();
      showToast("Nota anulada");
    };
  }

  function receiveModal(id){
    var p = Store.products.find(function(x){ return x.id === id; });
    if(!p) return;
    var expected = Number(p.orderedQty) || 0;
    var html = '<button class="close-x" data-close>✕</button>';
    html += '<div class="sheet-title">Recibir pedido</div>';
    html += '<div style="font-size:15px;font-weight:600;">' + esc(p.name) + '</div>';
    html += '<div class="faint" style="font-size:12.5px;margin:3px 0 16px;">' + esc(p.provider||'—') + ' · Stock actual ' + fmtNum(p.current) + ' ' + esc(p.unit) + (p.orderedLabel ? ' · Pedido ' + esc(p.orderedLabel) : (expected ? ' · Pedido +' + fmtNum(expected) : '')) + '</div>';
    html += '<div class="field"><label>¿Cuánto llegó? (en ' + esc(p.unit || 'unidades') + ')</label><input id="f-recv" type="number" inputmode="decimal" min="0" value="' + (expected ? fmtNum(expected) : '') + '"></div>';
    html += '<div id="recv-preview" class="muted" style="font-size:13px;min-height:18px;"></div>';
    html += '<div class="sheet-actions"><button class="btn btn-primary btn-block" id="confirm-recv">Confirmar recepción</button></div>';
    openModal(html);

    var input = document.getElementById("f-recv");
    var prev = document.getElementById("recv-preview");
    function round2(n){ return Math.round(n * 100) / 100; }
    function updatePreview(){
      if(input.value === "" || isNaN(Number(input.value))){ prev.textContent = ""; return; }
      prev.innerHTML = 'Nuevo stock: <b style="color:var(--text);">' + fmtNum(round2((Number(p.current)||0) + Number(input.value))) + ' ' + esc(p.unit) + '</b>';
    }
    input.addEventListener("input", updatePreview);
    updatePreview();
    input.focus(); input.select();

    function confirmReceive(){
      if(input.value === "" || isNaN(Number(input.value))){ showToast("Ingresá la cantidad recibida"); return; }
      var qty = Number(input.value);
      if(qty < 0){ showToast("La cantidad no puede ser negativa"); return; }
      var fresh = Store.products.find(function(x){ return x.id === id; });
      if(!fresh){ closeModal(); return; }
      var newCur = round2((Number(fresh.current)||0) + qty);
      Store.updateProduct(id, {
        current: newCur,
        ordered: false, orderedQty: null, orderedAt: null, orderedBy: null, orderedLabel: null, orderedFolio: null,
        updatedAt: new Date().toISOString(), updatedBy: CurrentUser || null
      });
      closeModal();
      fullRenderWithFab();
      showToast(fresh.name + ": stock " + fmtNum(newCur) + " " + (fresh.unit || ""));
    }
    document.getElementById("confirm-recv").onclick = confirmReceive;
    input.addEventListener("keydown", function(e){ if(e.key === "Enter") confirmReceive(); });
  }

    html += '<div class="field"><label>Email</label><input id="f-pemail" value="' + esc(v.email) + '"></div></div>';
    html += '<div class="field"><label>Días que toma pedidos</label><div class="day-group">' + dayCheckboxes("orderDays", v.orderDays) + '</div></div>';
    html += '<div class="field"><label>Días que entrega</label><div class="day-group">' + dayCheckboxes("deliveryDays", v.deliveryDays) + '</div></div>';
    html += '<div class="field"><label>Pedido mínimo</label><input id="f-pmin" value="' + esc(v.minOrder) + '"></div>';
    html += '<div class="field"><label>Forma de pago habitual</label><select id="f-pterms">' + payOptionsHtml(v.paymentTerms || "contraentrega") + '</select></div>';
    html += '<div class="sheet-actions"><button class="btn btn-primary btn-block" id="save-provider">Guardar</button></div>';
    if(!isNew){
      html += '<button class="btn btn-danger btn-block" id="delete-provider" style="margin-top:8px;">Eliminar proveedor</button>';
    }
    openModal(html);

    document.getElementById("save-provider").onclick = function(){
      var name = document.getElementById("f-pname").value.trim();
      if(!name){ showToast("El nombre es obligatorio"); return; }
      var orderDays = Array.prototype.slice.call(document.querySelectorAll('input[name="orderDays"]:checked')).map(function(el){ return el.value; });
      var deliveryDays = Array.prototype.slice.call(document.querySelectorAll('input[name="deliveryDays"]:checked')).map(function(el){ return el.value; });
      var data = {
        name: name,
        contact: document.getElementById("f-pcontact").value.trim(),
        phone: document.getElementById("f-pphone").value.trim(),
        email: document.getElementById("f-pemail").value.trim(),
        orderDays: orderDays,
        deliveryDays: deliveryDays,
        minOrder: document.getElementById("f-pmin").value.trim(),
        paymentTerms: document.getElementById("f-pterms").value,
        updatedBy: CurrentUser || null,
        updatedAt: new Date().toISOString()
      };
      if(isNew){ Store.addProvider(data).then(function(){ fullRenderWithFab(); showToast("Proveedor agregado"); }); }
      else { Store.updateProvider(v.id, data).then(function(){ fullRenderWithFab(); showToast("Proveedor actualizado"); }); }
      closeModal();
    };
    if(!isNew){
      document.getElementById("delete-provider").onclick = function(){
        if(confirm("¿Eliminar el proveedor \"" + v.name + "\"?")){
          Store.deleteProvider(v.id).then(function(){ fullRenderWithFab(); showToast("Proveedor eliminado"); });
          closeModal();
        }
      };
    }
  }

  /* ============ EVENTS ============ */
  function bindEvents(){
    document.querySelectorAll(".tab").forEach(function(btn){
      btn.addEventListener("click", function(){
        State.tab = btn.dataset.tab;
        State.dashboardStatusFilter = null;
        fullRenderWithFab();
      });
    });

    document.querySelectorAll("[data-goto]").forEach(function(el){
      el.addEventListener("click", function(){
        State.tab = "stock";
        State.categoryFilter = "ALL";
        State.dashboardStatusFilter = el.dataset.status === "ALL" ? null : el.dataset.status;
        fullRenderWithFab();
      });
    });

    var searchInput = document.getElementById("search-input");
    if(searchInput){
      searchInput.addEventListener("input", function(){
        State.search = searchInput.value;
        var pos = searchInput.selectionStart;
        fullRenderWithFab();
        var again = document.getElementById("search-input");
        if(again){ again.focus(); again.setSelectionRange(pos,pos); }
      });
    }

    document.querySelectorAll("[data-sfilter]").forEach(function(chip){
      chip.addEventListener("click", function(){
        State.dashboardStatusFilter = chip.dataset.sfilter === "ALL" ? null : chip.dataset.sfilter;
        fullRenderWithFab();
      });
    });

    document.querySelectorAll("[data-cat]").forEach(function(chip){
      chip.addEventListener("click", function(){
        State.categoryFilter = chip.dataset.cat;
        fullRenderWithFab();
      });
    });

    document.querySelectorAll("[data-step]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.dataset.id;
        var delta = Number(btn.dataset.step);
        var p = Store.products.find(function(x){ return x.id === id; });
        if(!p) return;
        var next = Math.max(0, (Number(p.current)||0) + delta);
        var input = document.querySelector('[data-current="' + id + '"]');
        if(input) input.value = fmtNum(next);
        Store.queueCurrentUpdate(id, next);
      });
    });

    document.querySelectorAll("[data-current]").forEach(function(input){
      input.addEventListener("change", function(){
        var id = input.dataset.current;
        var val = Math.max(0, Number(input.value) || 0);
        input.value = fmtNum(val);
        Store.queueCurrentUpdate(id, val);
      });
    });

    document.querySelectorAll("[data-edit-product]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var p = Store.products.find(function(x){ return x.id === btn.dataset.editProduct; });
        editProductModal(p);
      });
    });

    document.querySelectorAll("[data-edit-provider]").forEach(function(card){
      card.addEventListener("click", function(){
        var v = Store.providers.find(function(x){ return x.id === card.dataset.editProvider; });
        editProviderModal(v);
      });
    });

    document.querySelectorAll("[data-sel]").forEach(function(box){
      box.addEventListener("change", function(){
        if(box.checked) delete State.orderUnchecked[box.dataset.sel];
        else State.orderUnchecked[box.dataset.sel] = true;
        var row = box.closest(".pedido-row");
        if(row) row.classList.toggle("unchecked", !box.checked);
        var group = box.closest(".provider-group");
        var btn = group && group.querySelector("[data-mark-provider]");
        if(btn){
          var n = group.querySelectorAll("[data-sel]:checked").length;
          btn.disabled = n === 0;
          btn.textContent = n === 0 ? "Marcar como pedido" : "Marcar como pedido (" + n + ")";
        }
      });
    });

    document.querySelectorAll("[data-mark-provider]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var group = btn.closest(".provider-group");
        var ids = Array.prototype.slice.call(group.querySelectorAll("[data-sel]:checked")).map(function(b){ return b.dataset.sel; });
        if(ids.length === 0) return;
        var iso = new Date().toISOString();
        ids.forEach(function(id){
          var prod = Store.products.find(function(x){ return x.id === id; });
          if(!prod) return;
          var qty = Math.max((Number(prod.max)||0) - (Number(prod.current)||0), 0);
          delete State.orderUnchecked[id];
          Store.updateProduct(id, { ordered: true, orderedQty: qty, orderedAt: iso, orderedBy: CurrentUser || null, orderedLabel: null, orderedFolio: null });
        });
        fullRenderWithFab();
        showToast(ids.length + (ids.length === 1 ? " producto marcado" : " productos marcados") + " como pedido");
      });
    });

    document.querySelectorAll("[data-receive]").forEach(function(btn){
      btn.addEventListener("click", function(){ receiveModal(btn.dataset.receive); });
    });

    document.querySelectorAll("[data-unorder]").forEach(function(btn){
      btn.addEventListener("click", function(){
        Store.updateProduct(btn.dataset.unorder, { ordered: false, orderedQty: null, orderedAt: null, orderedBy: null, orderedLabel: null, orderedFolio: null });
        fullRenderWithFab();
        showToast("Se quitó la marca \"En camino\"");
      });
    });

    document.querySelectorAll("[data-pview]").forEach(function(btn){
      btn.addEventListener("click", function(){ State.pedidosView = btn.dataset.pview; fullRenderWithFab(); });
    });
    document.querySelectorAll("[data-nota-provider]").forEach(function(btn){
      btn.addEventListener("click", function(){ notaEditModal(btn.dataset.notaProvider); });
    });
    document.querySelectorAll("[data-nfilter]").forEach(function(btn){
      btn.addEventListener("click", function(){ State.notasFilter = btn.dataset.nfilter; fullRenderWithFab(); });
    });
    var rst = document.querySelector("[data-reset-notas]");
    if(rst) rst.addEventListener("click", async function(){
      if(!confirm("¿Borrar TODAS las notas de pedido y volver la numeración a NP-0001?\n\nSe pierde el historial de notas (útil para borrar pruebas). Los productos que seguían “En camino” por una nota vuelven a pendientes.")) return;
      if(!confirm("Última confirmación: esto no se puede deshacer. ¿Continuar?")) return;
      try { await Store.resetOrders(); showToast("Notas borradas. La próxima será NP-0001"); }
      catch(e){ console.error(e); showToast("No se pudo reiniciar. Probá de nuevo"); }
      fullRenderWithFab();
    });
    document.querySelectorAll("[data-open-order]").forEach(function(card){
      card.addEventListener("click", function(){ orderViewModal(card.dataset.openOrder); });
    });

    var addProvBtn = document.getElementById("add-provider-btn");
    if(addProvBtn) addProvBtn.addEventListener("click", function(){ editProviderModal(null); });

  }

  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta);
  }

  /* ============ FAB (only on stock tab) ============ */
  function fullRenderWithFab(){
    render();
    var old = document.getElementById("fab-add");
    if(old) old.remove();
    if(State.tab === "stock"){
      var fab = document.createElement("button");
      fab.className = "fab"; fab.id = "fab-add"; fab.textContent = "+";
      fab.setAttribute("aria-label","Agregar producto");
      document.body.appendChild(fab);
      fab.addEventListener("click", function(){ editProductModal(null); });
    }
  }

  function handleChange(opts){
    if(opts && opts.skipFullRender){ updateLiveCounts(); return; }
    fullRenderWithFab();
  }

  /* ============ AUTH / INIT ============ */
  var CurrentUser = null;

  function translateAuthError(code){
    var map = {
      "auth/invalid-email": "El email no es válido.",
      "auth/user-not-found": "No existe un usuario con ese email.",
      "auth/wrong-password": "Contraseña incorrecta.",
      "auth/invalid-credential": "Email o contraseña incorrectos.",
      "auth/too-many-requests": "Demasiados intentos. Probá de nuevo en unos minutos.",
      "auth/network-request-failed": "Error de conexión. Revisá tu internet."
    };
    return map[code] || "No se pudo iniciar sesión. Intentá de nuevo.";
  }

  function renderLoginForm(){
    var card = document.getElementById("login-card");
    card.innerHTML =
      '<h1 class="brand">Monono <span>Stock</span></h1>' +
      '<div class="brand-sub">Iniciá sesión para continuar</div>' +
      '<div id="login-error" class="login-error" style="display:none;"></div>' +
      '<div class="field"><label>Email</label><input id="login-email" type="email" autocomplete="username"></div>' +
      '<div class="field"><label>Contraseña</label><input id="login-password" type="password" autocomplete="current-password"></div>' +
      '<button class="btn btn-primary btn-block" id="login-btn">Iniciar sesión</button>';

    function attemptLogin(){
      var email = document.getElementById("login-email").value.trim();
      var pass = document.getElementById("login-password").value;
      var errEl = document.getElementById("login-error");
      errEl.style.display = "none";
      if(!email || !pass){ errEl.textContent = "Completá email y contraseña."; errEl.style.display = "block"; return; }
      var btn = document.getElementById("login-btn");
      btn.textContent = "Ingresando…"; btn.disabled = true;
      firebase.auth().signInWithEmailAndPassword(email, pass).catch(function(err){
        errEl.textContent = translateAuthError(err.code);
        errEl.style.display = "block";
        btn.textContent = "Iniciar sesión"; btn.disabled = false;
      });
    }
    document.getElementById("login-btn").addEventListener("click", attemptLogin);
    ["login-email","login-password"].forEach(function(id){
      document.getElementById(id).addEventListener("keydown", function(e){ if(e.key === "Enter") attemptLogin(); });
    });
  }

  function renderConfigMissing(){
    var card = document.getElementById("login-card");
    card.innerHTML =
      '<h1 class="brand">Monono <span>Stock</span></h1>' +
      '<div class="brand-sub">Falta configuración</div>' +
      '<p class="muted" style="font-size:13.5px;line-height:1.5;margin-top:6px;">' +
      'Todavía no completaste <code>firebase-config.js</code> con las claves de tu proyecto de Firebase. ' +
      'Seguí el paso a paso del <code>README.md</code> incluido y volvé a cargar la página.</p>';
  }

  var configOk = (typeof firebaseConfig !== "undefined") && firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("TU_") !== 0;

  if(!configOk){
    renderConfigMissing();
  } else {
    firebase.auth().onAuthStateChanged(function(user){
      var loginScreen = document.getElementById("login-screen");
      var appEl = document.getElementById("app");
      if(user){
        CurrentUser = user.email;
        loginScreen.style.display = "none";
        appEl.style.display = "";
        Store.init(handleChange).then(function(){ fullRenderWithFab(); });
      } else {
        CurrentUser = null;
        Store.unsubscribe();
        appEl.style.display = "none";
        loginScreen.style.display = "flex";
        renderLoginForm();
      }
    }, function(err){
      console.error("auth error", err);
      renderLoginForm();
    });

    document.addEventListener("click", function(e){
      if(e.target && e.target.id === "logout-btn"){
        firebase.auth().signOut();
      }
    });
  }

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(e){ console.error("SW register error", e); });
    });
  }

})();
</script>
</body>
</html>
